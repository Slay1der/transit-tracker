services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backend]

  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      NUM_BUSES: "20"
      TICK_SECONDS: "3"
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

  api:
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [frontend, backend]

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

# web can reach api, but not redis or worker. api is the only bridge between the two.
networks:
  frontend:
  backend:
    internal: true   # no way out to the internet: redis and worker can't phone home
