# Serves the map page and forwards /api/* to the api service.
# Because the browser only ever talks to this one address, there are no cross-origin (CORS) problems.
server {
    listen 8080;            # 8080, not 80: a non-root user can't open ports below 1024
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;   # "api" is the service name compose/Kubernetes will give the API
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
