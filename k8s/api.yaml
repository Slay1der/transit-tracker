apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: transit-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /stops
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
# 👇 YOUR TURN: the api Service
# copy the Redis Service, then change:
#   1. the name      → ? (web's nginx calls "http://api:8000")
#   2. the selector  → which label do the api pods have?
#   3. the ports     → which port does uvicorn listen on?
#
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
      
