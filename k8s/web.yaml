apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web                 # 🏷️ 1
  template:
    metadata:
      labels:
        app: web                   # 🏷️ 2 (must match 1)
    spec:
      containers:
        - name: web
          image: transit-web:latest # 3. the web image you built
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080  # 4. where nginx listens
          readinessProbe:
            httpGet:
              path: /healthz        # (already in nginx.conf 😉)
              port: 8080        # 5. same port as 4
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web                     # 6
spec:
  type: ClusterIP
  selector:
    app: web                   # 🏷️ 7 (must match 2)
  ports:
    - name: http
      port:  8080               # 8. your choice: 80 or 8080
      targetPort: 8080         # 9. must match 4
      protocol: TCP
